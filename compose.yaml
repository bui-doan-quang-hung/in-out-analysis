services:
  frontend:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./fe:/usr/share/nginx/html:ro
      - ./fe/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
  backend:
    build: ./be
    volumes:
      - gateview-data:/data
    restart: unless-stopped
volumes:
  gateview-data:

